name: Prueba en Windows
# Instala a Viernes en un Windows limpio y edita un video de prueba de principio a fin.
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: windows
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Los scripts bajan con finales de linea correctos
        run: |
          if grep -l $'\r' instalar.sh voz/di.sh voz/al-iniciar.sh scripts/common.py; then echo "CRLF en scripts"; exit 1; fi
      - name: Instalar
        run: bash instalar.sh
      - name: El atajo de Python y ffmpeg responden como en la documentacion
        run: |
          estudio/.venv/bin/python -c "import faster_whisper, cv2, av; print('imports ok á✓')"
          estudio/bin/ffmpeg -version | head -1
      - name: La voz encuentra su frase sin tronar
        run: |
          bash voz/di.sh listo; echo "di.sh salio con $?"
          test -s .viernes-estado/recientes-listo
          CLAUDE_PROJECT_DIR="$(cygpath -w "$PWD")" bash -c 'bash "$CLAUDE_PROJECT_DIR/voz/al-iniciar.sh"'
      - name: El acceso del Escritorio existe
        run: |
          D="$(powershell.exe -NoProfile -Command "[Environment]::GetFolderPath('Desktop')" | tr -d '\r')"
          test -f "$(cygpath -u "$D")/Abrir Viernes.cmd"
      - name: Fabricar un video de prueba con voz
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Speech
          $s = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $s.Rate = -1
          New-Item -ItemType Directory -Force -Path prueba | Out-Null
          $s.SetOutputToWaveFile("$PWD\prueba\voz.wav")
          $s.Speak("Hello everyone. Today we review a perfume. This perfume smells very good. The perfume lasts all day. Thank you for watching this perfume review. See you next time.")
          $s.Dispose()
      - name: Editar de principio a fin
        run: |
          set -x
          P=estudio/.venv/bin/python
          $P scripts/nuevo.py prueba
          estudio/bin/ffmpeg -v error -y -f lavfi -i testsrc2=s=1920x1080:r=30 -i prueba/voz.wav -shortest -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac videos/prueba/crudo/clip.mp4
          $P scripts/analyze.py prueba --modelo tiny
          $P scripts/cut.py prueba --sin-cortes --modelo tiny
          $P scripts/words.py ver prueba | head -20
          printf '%s' '{"titulo": "Prueba", "perfume": "Prueba", "foco": {"x": 0.5, "y": 0.42}, "firma": {"aplausos": false, "oler_bien": false, "cierre": false, "rafaguiza": false}, "cola": 1, "beats": [{"tipo": "palabra", "en": "perfume", "texto": "PERFUME", "efecto": "pop", "lado": "arriba"}]}' > videos/prueba/plan.json
          $P scripts/render.py prueba --formato 16:9 --entrega borrador
          $P scripts/render.py prueba --formato 9:16 --entrega borrador
          ls -la videos/prueba/out
          test -s videos/prueba/out/prueba-16x9-borrador.mp4
          test -s videos/prueba/out/prueba-9x16-borrador.mp4
          $P scripts/cuadros.py videos/prueba/out/prueba-16x9-borrador.mp4 videos/prueba/out/hoja.jpg 1 3 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultado
          retention-days: 7
          path: |
            .viernes-estado/instalar.log
            videos/prueba/out/
